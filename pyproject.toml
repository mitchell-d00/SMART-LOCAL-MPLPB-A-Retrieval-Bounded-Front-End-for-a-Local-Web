[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-local-mplpb"
version = "0.1.0"
description = "A standard-library front end for an MPLPB local web: routed retrieval, provenance-carrying citations, mode switching, and taught pages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mitchell D. McPhetridge" }]
keywords = ["mplpb", "local-web", "retrieval", "knowledge-base", "provenance", "crawler", "stateless-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mdmcphetridge/smart-local-mplpb"
Issues = "https://github.com/mdmcphetridge/smart-local-mplpb/issues"

[project.scripts]
mplpb = "mplpb.__main__:main"

[tool.setuptools]
packages = ["mplpb"]

[tool.setuptools.package-data]
mplpb = ["data/*.json", "data/*.css"]
